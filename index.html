<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Progresīvie Rīgas iecirkņos – 2022, 2025, 2026</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; color: #222; }
    header { padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
    header h1 { font-size: 18px; margin: 0; }
    #map { height: 75vh; }
    .pie-icon { background: none; border: none; }
    .legend { background: #fff; padding: 8px 10px; border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.3); font-size: 13px; line-height: 1.6; }
    .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
    table { border-collapse: collapse; font-size: 13px; }
    th, td { padding: 3px 8px; border-bottom: 1px solid #ddd; text-align: left; }
    td.num { text-align: right; }
    .popup h3 { margin: 0 0 4px; font-size: 14px; }
    .popup .stations { color: #555; font-size: 12px; }
    section { padding: 12px 16px; }
  </style>
</head>
<body>
  <header>
    <h1>PROGRESĪVIE Rīgas vēlēšanu iecirkņos</h1>
    <label><input type="radio" name="mode" value="votes" checked /> Sektori pēc balsu skaita</label>
    <label><input type="radio" name="mode" value="pct" /> Sektori pēc procentiem</label>
  </header>
  <div id="map"></div>
  <section>
    <p>Katrs aplis ir viena vēlēšanu vieta (ēka); visi tajā esošie iecirkņi ir saskaitīti. Apļa izmērs atbilst Progresīvo
      balsu kopskaitam trijās vēlēšanās. Procenti – no derīgajām vēlēšanu aploksnēm (kā CVK).</p>
    <h2>Speciālās komisijas (nav kartē)</h2>
    <table id="special"></table>
    <div id="unlocated"></div>
  </section>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="data.js"></script>
  <script src="pie.js"></script>
  <script src="app.js"></script>
</body>
</html>
